name: REINFOLIB Okinawa quarterly data

on:
  schedule:
    - cron: "23 22 3 * *"   # 毎月4日 07:23 JST に新しい四半期の公表を確認（変化がなければコミットしない）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reinfolib-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and aggregate
        env:
          REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
        run: python scripts/fetch_reinfolib.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reinfolib-okinawa.json data/reinfolib
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "REINFOLIB Okinawa data update $(date -u +%Y-%m-%d)"
          git push
