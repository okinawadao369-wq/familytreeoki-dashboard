name: e-Stat Okinawa municipal indicators

on:
  schedule:
    - cron: "41 22 4 * *"   # 毎月5日 07:41 JST（年次統計の更新を確認。変化がなければコミットしない）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estat-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch e-Stat
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python scripts/fetch_estat.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estat-okinawa.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "e-Stat Okinawa data update $(date -u +%Y-%m-%d)"
          git push
