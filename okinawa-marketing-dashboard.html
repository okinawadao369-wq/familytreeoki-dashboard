<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>koya 限定共有</title>
<style>
  body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic',sans-serif;background:#0f172a;color:#e2e8f0;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .box{max-width:360px;width:100%;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:32px 28px;text-align:center}
  .box h2{font-size:16px;margin:0 0 6px 0}
  .box p{font-size:12px;color:#94a3b8;margin:0 0 20px 0}
  input[type=password]{width:100%;box-sizing:border-box;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;color:#e2e8f0;font-size:14px;margin-bottom:12px}
  input[type=password]:focus{outline:none;border-color:#3b82f6}
  button{width:100%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #err{color:#f87171;font-size:11px;margin-top:10px;min-height:14px}
  #loading{font-size:11px;color:#94a3b8;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="box">
  <h2>🔒 koya 限定共有コンテンツ</h2>
  <p>関係者限定です。合言葉を入力してください。</p>
  <input type="password" id="pw" placeholder="合言葉" autofocus onkeydown="if(event.key==='Enter')unlock()">
  <button id="btn" onclick="unlock()">開く</button>
  <div id="err"></div>
  <div id="loading">復号中...</div>
</div>
<script>
function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return buf.buffer;
}
async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  const loading = document.getElementById('loading');
  err.textContent = '';
  if(!pw){ err.textContent = '合言葉を入力してください'; return; }
  btn.disabled = true; loading.style.display = 'block';
  try {
    const resp = await fetch('./okinawa-marketing-dashboard.enc.json');
    if(!resp.ok) throw new Error('fetch failed');
    const {salt, iv, data} = await resp.json();
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pw), {name:'PBKDF2'}, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt: b64ToBuf(salt), iterations:250000, hash:'SHA-256'},
      keyMaterial, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64ToBuf(iv)}, key, b64ToBuf(data));
    const html = new TextDecoder().decode(plainBuf);
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    window.location.replace(url);
  } catch(e) {
    err.textContent = '合言葉が違います。もう一度お試しください。';
    btn.disabled = false; loading.style.display = 'none';
  }
}
</script>
</body>
</html>
